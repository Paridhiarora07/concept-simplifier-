<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Database History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>📚 Database History</h1>

        <p class="subtitle">
            Saved Concept Simplifier Records
        </p>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Original Text</th>
                        <th>Simplified Text</th>
                        <th>Readability Score</th>
                    </tr>
                </thead>

                <tbody>

                    {% for record in records %}

                    <tr>
                        <td>{{ record[0] }}</td>
                        <td>{{ record[1] }}</td>
                        <td>{{ record[2] }}</td>
                        <td>{{ record[3] }}</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

        <br>

        <a href="/" class="back-button">
            ← Back to Concept Simplifier
        </a>

    </div>

</body>
</html>
